name: TG Post Trigger

on:
  schedule:
    - cron: "10 5 * * 1,3,5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/tg-post
        env:
          KEY: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -sS -m 60 -f \
            -H "X-TG-Post-Key: ${KEY}" \
            "https://astap.pythonanywhere.com/api/tg-post"
