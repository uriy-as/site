name: TG Post Trigger

on:
  schedule:
    # 08:00 Kyiv (EET, UTC+2). В летнее время (EEST, UTC+3) сработает в 09:00 Kyiv.
    - cron: "0 6 * * 1,3,5"
    # Резервный запуск (GitHub Actions cron может пропускать/задерживать)
    - cron: "30 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry:
        description: "Показать пост без отправки"
        type: boolean
        default: false
      force:
        description: "Игнорировать день недели (для теста)"
        type: boolean
        default: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/tg-post
        env:
          KEY: ${{ secrets.TELEGRAM_TOKEN }}
          DRY: ${{ inputs.dry == true && '1' || '' }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
        run: |
          code=$(curl -sS -m 60 -o /tmp/tg-post.json -w "%{http_code}" \
            -H "X-TG-Post-Key: ${KEY}" \
            "https://astap.pythonanywhere.com/api/tg-post?dry=${DRY}&force=${FORCE}" || true)
          echo "HTTP $code"
          cat /tmp/tg-post.json || true
          echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
