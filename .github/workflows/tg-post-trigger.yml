name: TG Post Trigger

on:
  schedule:
    - cron: "10 5 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry:
        description: "Показать пост без отправки"
        type: boolean
        default: false
      force:
        description: "Игнорировать день недели (для теста)"
        type: boolean
        default: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/tg-post
        env:
          KEY: ${{ secrets.TELEGRAM_TOKEN }}
          DRY: ${{ inputs.dry == true && '1' || '' }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
        run: |
          curl -sS -m 60 -f \
            -H "X-TG-Post-Key: ${KEY}" \
            "https://astap.pythonanywhere.com/api/tg-post?dry=${DRY}&force=${FORCE}"
