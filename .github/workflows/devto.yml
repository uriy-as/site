name: Dev.to Auto-Post

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run Dev.to poster
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: "@webstudio_chanel"
        run: python .github/scripts/devto_post.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/devto_state.json
          git diff --cached --quiet || git commit -m "Update Dev.to post state"
          git push
