name: Google Indexing

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install PyJWT requests cryptography
      - name: Run indexing
        env:
          GA_KEY: ${{ secrets.GA_SERVICE_KEY }}
        run: |
          python -c "import os; open('/tmp/ga-key.json','w').write(os.environ['GA_KEY'])"
          python .github/scripts/indexing_api.py /tmp/ga-key.json
