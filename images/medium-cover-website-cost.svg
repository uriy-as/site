<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="200" y1="0" x2="1200" y2="500"/>
    <line x1="400" y1="0" x2="1200" y2="400"/>
    <line x1="0" y1="200" x2="800" y2="630"/>
    <line x1="0" y1="400" x2="600" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="950" cy="150" r="120" fill="#e94560" opacity="0.15"/>
  <circle cx="1050" cy="200" r="80" fill="#533483" opacity="0.2"/>
  <circle cx="150" cy="500" r="100" fill="#0f3460" opacity="0.2"/>
  
  <!-- Laptop illustration -->
  <g transform="translate(800, 180)">
    <!-- Laptop screen -->
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="10" width="260" height="150" rx="4" fill="#0f172a"/>
    
    <!-- Code lines on screen -->
    <rect x="25" y="30" width="120" height="6" rx="3" fill="#22d3ee" opacity="0.7"/>
    <rect x="25" y="45" width="180" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
    <rect x="25" y="60" width="90" height="6" rx="3" fill="#34d399" opacity="0.6"/>
    <rect x="25" y="75" width="200" height="6" rx="3" fill="#f472b6" opacity="0.4"/>
    <rect x="25" y="90" width="150" height="6" rx="3" fill="#fbbf24" opacity="0.5"/>
    <rect x="25" y="105" width="110" height="6" rx="3" fill="#22d3ee" opacity="0.6"/>
    
    <!-- Laptop base -->
    <path d="M-20,180 L300,180 L290,200 L10,200 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  </g>
  
  <!-- Dollar signs -->
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#e94560" opacity="0.3">
    <text x="100" y="120" font-size="72">$</text>
    <text x="180" y="180" font-size="48">$</text>
    <text x="900" y="420" font-size="60">$</text>
    <text x="1000" y="380" font-size="40">$</text>
  </g>
  
  <!-- Title text -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="#ffffff">
    How Much Does a
  </text>
  <text x="80" y="400" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="#ffffff">
    Website Cost in 2026?
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
    Real prices, no BS
  </text>
  
  <!-- Accent line -->
  <rect x="80" y="480" width="120" height="4" rx="2" fill="#e94560"/>
  
  <!-- Brand -->
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="18" fill="#64748b">
    WebStudio В· uriy-as.org
  </text>
</svg>
